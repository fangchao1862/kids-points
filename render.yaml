# Render Blueprint：一键同时创建「Web 服务 + PostgreSQL 数据库」
# 用法见 DEPLOY-RENDER.md
databases:
  - name: kids-points-db
    databaseName: kids_points
    postgresMajorVersion: "16"
    plan: free
    region: singapore

services:
  - type: web
    name: kids-points
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Shanghai
      # 由上面数据库自动注入连接串，app.js 检测到后自动启用 PostgreSQL 持久化
      - key: DATABASE_URL
        fromDatabase:
          name: kids-points-db
          property: connectionString
